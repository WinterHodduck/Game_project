<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지</title>
    <link rel="stylesheet" href="../css/desert-theme.css" />
    <style>
        :root {
            --sky-light: #e8f6ff;
            --sand-white: #fcfaf5;
            --sand-warm: #f5e6c4;
            --sand-gold: #d9a441;
            --sand-amber: #b87d24;
            --ink-dark: #2c353d;
            --ink-muted: #5f6c78;
            --card-border: rgba(217, 164, 65, 0.38);
            --shadow-soft: 0 12px 28px rgba(45, 95, 135, 0.14);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Pretendard", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--ink-dark);
            background:
                radial-gradient(circle at 82% 10%, rgba(255, 250, 224, 0.95) 0%, rgba(255, 250, 224, 0) 28%),
                linear-gradient(180deg,
                    #b9e2ff 0%,
                    var(--sky-light) 34%,
                    var(--sand-white) 62%,
                    var(--sand-warm) 100%);
            padding: 36px 20px 64px;
        }

        h1 {
            margin: 0 0 16px;
            text-align: center;
            font-size: clamp(1.65rem, 3.2vw, 2.35rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #1f4e78;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.9);
        }

        /* 타이틀 아래 상단 메뉴바 */
        .admin-menubar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            max-width: 720px;
            margin: 0 auto 24px;
            padding: 10px 18px;
            border-radius: 999px;
            background: rgba(255, 253, 248, 0.88);
            border: 1px solid var(--card-border);
            box-shadow: 0 6px 18px rgba(45, 95, 135, 0.1);
            backdrop-filter: blur(6px);
        }

        .admin-menubar button {
            appearance: none;
            border: 1px solid rgba(217, 164, 65, 0.55);
            background: linear-gradient(135deg, #4da3e0 0%, #7ec4f2 55%, #e8be68 100%);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 800;
            padding: 10px 24px;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(77, 163, 224, 0.28);
            text-shadow: 0 1px 2px rgba(20, 50, 80, 0.25);
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }

        .admin-menubar button:hover {
            transform: translateY(-2px);
            filter: brightness(1.04);
            box-shadow: 0 8px 18px rgba(217, 164, 65, 0.32);
        }

        #content {
            max-width: 720px;
            margin: 0 auto;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, var(--sand-white) 75%, #faeed4 100%);
            border: 1.5px solid var(--card-border);
            border-radius: 20px;
            padding: 28px 32px 34px;
            box-shadow: var(--shadow-soft);
        }

        #content h2 {
            margin: 0 0 24px;
            padding: 12px 18px;
            font-size: 1.4rem;
            font-weight: 800;
            color: #5d4012;
            background: linear-gradient(90deg, rgba(255, 252, 245, 0.95) 0%, rgba(245, 230, 196, 0.85) 65%, rgba(203, 234, 255, 0.55) 100%);
            border-left: 5px solid var(--sand-gold);
            border-radius: 0 12px 12px 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 0.92rem;
            font-weight: 700;
            color: #1f4e78;
        }

        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 11px;
            border: 1px solid rgba(77, 163, 224, 0.45);
            background: rgba(255, 255, 255, 0.94);
            color: var(--ink-dark);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.16s ease, box-shadow 0.16s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--sand-gold);
            box-shadow: 0 0 0 3px rgba(217, 164, 65, 0.22);
        }

        .drop-zone {
            border: 2px dashed rgba(184, 125, 36, 0.55);
            border-radius: 12px;
            padding: 22px 16px;
            text-align: center;
            background: rgba(232, 246, 255, 0.62);
            color: var(--ink-muted);
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: border-color 0.18s ease, background-color 0.18s ease, transform 0.18s ease;
        }

        .drop-zone:hover,
        .drop-zone.drag-over {
            border-color: var(--sand-amber);
            background: rgba(245, 230, 196, 0.72);
            color: #5d4012;
        }

        .submit-btn {
            width: 100%;
            margin-top: 8px;
            padding: 12px 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 800;
            color: #ffffff;
            background: linear-gradient(135deg, #3b93d4 0%, #6cb9ee 52%, #dfa944 100%);
            box-shadow: 0 6px 16px rgba(59, 147, 212, 0.3);
            transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.04);
            box-shadow: 0 8px 20px rgba(217, 164, 65, 0.35);
        }

        /* 몬스터 전체보기(수정/삭제) 모달 스타일 */
        #adminMobModal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(18, 32, 46, 0.72);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #adminMobModal.open {
            display: flex;
        }

        #adminMobModal .admin-modal-box {
            position: relative;
            width: min(1020px, 95vw);
            max-height: 86vh;
            padding: 22px 24px;
            border-radius: 18px;
            background: linear-gradient(180deg, #ffffff 0%, var(--sand-white) 100%);
            border: 2px solid var(--sand-gold);
            box-shadow: 0 20px 44px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        #adminMobModal .admin-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
            border-bottom: 1.5px solid rgba(217, 164, 65, 0.35);
        }

        #adminMobModal .admin-modal-header h3 {
            margin: 0;
            font-size: 1.22rem;
            font-weight: 800;
            color: #1f4e78;
        }

        #adminMobModal .admin-modal-close {
            border: none;
            background: rgba(245, 230, 196, 0.85);
            color: var(--ink-dark);
            font-size: 1.05rem;
            font-weight: 800;
            width: 34px;
            height: 34px;
            border-radius: 999px;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        #adminMobModal .admin-modal-close:hover {
            background: var(--sand-gold);
            color: #ffffff;
        }

        #adminMobModal .admin-modal-body {
            overflow-y: auto;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            background: #ffffff;
        }

        #adminMobModal table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }

        #adminMobModal thead {
            position: sticky;
            top: 0;
            z-index: 2;
            background: linear-gradient(90deg, #f7ecd2 0%, #e4f3ff 100%);
        }

        #adminMobModal th {
            padding: 11px 8px;
            font-weight: 800;
            color: #1f4e78;
            text-align: center;
            border-bottom: 2px solid rgba(217, 164, 65, 0.45);
            white-space: nowrap;
        }

        #adminMobModal td {
            padding: 9px 8px;
            text-align: center;
            vertical-align: middle;
            border-bottom: 1px solid rgba(217, 164, 65, 0.22);
            color: var(--ink-dark);
        }

        #adminMobModal tbody tr:hover td {
            background-color: rgba(232, 246, 255, 0.55);
        }

        #adminMobModal td img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid rgba(217, 164, 65, 0.45);
        }

        .admin-action-group {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-mob-edit,
        .btn-mob-delete {
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.82rem;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.14s ease, filter 0.14s ease;
        }

        .btn-mob-edit {
            background: linear-gradient(135deg, #4da3e0 0%, #3b82c4 100%);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(77, 163, 224, 0.28);
        }

        .btn-mob-delete {
            background: linear-gradient(135deg, #e05a5a 0%, #c63d3d 100%);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(224, 90, 90, 0.28);
        }

        .btn-mob-edit:hover,
        .btn-mob-delete:hover {
            transform: translateY(-1px);
            filter: brightness(1.06);
        }

        /* [신규 추가] 몬스터 수정용 모달 스타일 */
        #adminEditMobModal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1100;
            background: rgba(18, 32, 46, 0.78);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #adminEditMobModal.open {
            display: flex;
        }

        #adminEditMobModal .edit-modal-box {
            position: relative;
            width: min(640px, 95vw);
            max-height: 88vh;
            padding: 24px 26px 26px;
            border-radius: 18px;
            background: linear-gradient(180deg, #ffffff 0%, var(--sand-white) 78%, #faeed4 100%);
            border: 2px solid var(--sand-gold);
            box-shadow: 0 22px 48px rgba(0, 0, 0, 0.38);
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }

        #adminEditMobModal .edit-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
            border-bottom: 1.5px solid rgba(217, 164, 65, 0.35);
        }

        #adminEditMobModal .edit-modal-header h3 {
            margin: 0;
            font-size: 1.22rem;
            font-weight: 800;
            color: #1f4e78;
        }

        #adminEditMobModal .edit-modal-close {
            border: none;
            background: rgba(245, 230, 196, 0.85);
            color: var(--ink-dark);
            font-size: 1.05rem;
            font-weight: 800;
            width: 34px;
            height: 34px;
            border-radius: 999px;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        #adminEditMobModal .edit-modal-close:hover {
            background: var(--sand-gold);
            color: #ffffff;
        }

        .edit-modal-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px 14px;
        }

        .edit-modal-grid .edit-field-full {
            grid-column: 1 / -1;
        }

        @media (max-width: 600px) {
            .edit-modal-grid {
                grid-template-columns: 1fr;
            }
        }

        .edit-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .edit-field label {
            font-size: 0.88rem;
            font-weight: 700;
            color: #1f4e78;
        }

        .edit-field input[type="text"],
        .edit-field input[type="number"],
        .edit-field textarea {
            width: 100%;
            padding: 9px 12px;
            border-radius: 10px;
            border: 1px solid rgba(77, 163, 224, 0.45);
            background: rgba(255, 255, 255, 0.95);
            color: var(--ink-dark);
            font-size: 0.92rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.16s ease, box-shadow 0.16s ease;
        }

        .edit-field input:focus,
        .edit-field textarea:focus {
            border-color: var(--sand-gold);
            box-shadow: 0 0 0 3px rgba(217, 164, 65, 0.22);
        }

        .edit-modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 6px;
        }

        .btn-edit-cancel {
            padding: 11px 18px;
            border: 1px solid rgba(217, 164, 65, 0.5);
            border-radius: 11px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--ink-dark);
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .btn-edit-cancel:hover {
            background: rgba(245, 230, 196, 0.8);
        }

        .btn-edit-submit {
            padding: 11px 22px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #3b93d4 0%, #6cb9ee 52%, #dfa944 100%);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(59, 147, 212, 0.3);
            transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
        }

        .btn-edit-submit:hover {
            transform: translateY(-1px);
            filter: brightness(1.04);
            box-shadow: 0 8px 20px rgba(217, 164, 65, 0.35);
        }
    </style>
</head>

<body>
    <h1>관리자 페이지</h1>

    <!-- 타이틀 아래 상단 메뉴바 (홈으로 / 삭제/수정 버튼) -->
    <div class="admin-menubar">
        <button type="button" onclick="location.href='../index.html'">홈으로</button>
        <button type="button" onclick="openAdminMobModal()">삭제/수정</button>
    </div>

    <div id="content">
        <h2>몬스터 등록</h2>
        <form id="monsterCreateForm">
            <div class="form-group">
                <label for="add-name">이름</label>
                <input id="add-name" type="text" required />
            </div>

            <div class="form-group">
                <label for="add-image">몬스터 이미지 (마우스 드래그 또는 파일 선택)</label>
                <div class="drop-zone" id="dropZone">이미지 파일을 여기에 마우스로 드래그하여 놓으세요 (또는 클릭하여 선택)</div>
                <input type="file" id="add-image" accept="image/*" style="display: none;" />
            </div>

            <div class="form-group">
                <label for="add-level">레벨</label>
                <input id="add-level" type="number" required />
            </div>

            <div class="form-group">
                <label for="add-habitat">서식지</label>
                <input id="add-habitat" type="text" required />
            </div>

            <div class="form-group">
                <label for="add-hp">체력(HP)</label>
                <input id="add-hp" type="number" required />
            </div>

            <div class="form-group">
                <label for="add-exp">경험치(EXP)</label>
                <input id="add-exp" type="number" required />
            </div>

            <div class="form-group">
                <label for="add-attack">공격력</label>
                <input id="add-attack" type="number" required />
            </div>

            <div class="form-group">
                <label for="add-drops">드랍 아이템(쉼표 구분)</label>
                <input id="add-drops" type="text" placeholder="예: 단단한 갑각 파편, 모래 조각" />
            </div>

            <div class="form-group">
                <label for="add-description">설명</label>
                <textarea id="add-description" rows="3" required></textarea>
            </div>

            <button type="button" class="submit-btn" onclick="handleAddMenu()">등록하기</button>
        </form>
    </div>

    <!-- 몬스터 전체보기 및 우측 수정/삭제 버튼 모달 -->
    <div id="adminMobModal" onclick="handleAdminModalBackdropClick(event)">
        <div class="admin-modal-box">
            <div class="admin-modal-header">
                <h3>몬스터 전체 목록 (수정 / 삭제)</h3>
                <button type="button" class="admin-modal-close" onclick="closeAdminMobModal()"
                    aria-label="닫기">✕</button>
            </div>
            <div class="admin-modal-body" id="adminMobModalBody"></div>
        </div>
    </div>

    <!-- [신규 추가] 몬스터 수정용 모달 -->
    <div id="adminEditMobModal" onclick="handleEditModalBackdropClick(event)">
        <div class="edit-modal-box">
            <div class="edit-modal-header">
                <h3>몬스터 정보 수정</h3>
                <button type="button" class="edit-modal-close" onclick="closeEditMobModal()" aria-label="닫기">✕</button>
            </div>

            <form id="monsterEditForm" onsubmit="return false;">
                <input type="hidden" id="edit-id" />
                <div class="edit-modal-grid">
                    <div class="edit-field">
                        <label for="edit-name">이름 (name)</label>
                        <input id="edit-name" type="text" />
                    </div>

                    <div class="edit-field">
                        <label for="edit-level">레벨 (level)</label>
                        <input id="edit-level" type="number" />
                    </div>

                    <div class="edit-field">
                        <label for="edit-habitat">서식지 (habitat)</label>
                        <input id="edit-habitat" type="text" />
                    </div>

                    <div class="edit-field">
                        <label for="edit-hp">체력 (hp)</label>
                        <input id="edit-hp" type="number" />
                    </div>

                    <div class="edit-field">
                        <label for="edit-exp">경험치 (exp)</label>
                        <input id="edit-exp" type="number" />
                    </div>

                    <div class="edit-field">
                        <label for="edit-attack">공격력 (attack)</label>
                        <input id="edit-attack" type="number" />
                    </div>

                    <div class="edit-field edit-field-full">
                        <label for="edit-drops">드랍 아이템 (drops)</label>
                        <input id="edit-drops" type="text" placeholder="예: 단단한 갑각 파편, 모래 조각" />
                    </div>

                    <div class="edit-field edit-field-full">
                        <label for="edit-description">설명 (description)</label>
                        <textarea id="edit-description" rows="3"></textarea>
                    </div>
                </div>

                <div class="edit-modal-footer">
                    <button type="button" class="btn-edit-cancel" onclick="closeEditMobModal()">취소</button>
                    <button type="button" class="btn-edit-submit" onclick="handleUpdateMob()">수정하기</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/data_api.js"></script>
    <script>
        (function initDropZone() {
            const dropZone = document.getElementById("dropZone");
            const imageInput = document.getElementById("add-image");
            if (!dropZone || !imageInput) return;

            dropZone.addEventListener("click", () => imageInput.click());

            dropZone.addEventListener("dragover", (e) => {
                e.preventDefault();
                dropZone.classList.add("drag-over");
            });

            dropZone.addEventListener("dragleave", (e) => {
                e.preventDefault();
                dropZone.classList.remove("drag-over");
            });

            dropZone.addEventListener("drop", (e) => {
                e.preventDefault();
                dropZone.classList.remove("drag-over");

                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    imageInput.files = e.dataTransfer.files;
                    dropZone.textContent = `선택된 파일: ${e.dataTransfer.files[0].name}`;
                }
            });

            imageInput.addEventListener("change", (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    dropZone.textContent = `선택된 파일: ${e.target.files[0].name}`;
                }
            });
        })();

        async function handleAddMenu(e) {
            if (e) e.preventDefault();

            const dropsText = document.getElementById("add-drops").value;
            const drops = dropsText
                .split(",")
                .map((item) => item.trim())
                .filter(Boolean)
                .map((name) => ({ name }));

            const imageFile = document.getElementById("add-image").files[0];
            let imagePath = "./image/monster01.jpg";

            if (imageFile) {
                const formData = new FormData();
                formData.append("file", imageFile);

                try {
                    const uploadRes = await fetch("http://127.0.0.1:8000/monsters/upload-image", {
                        method: "POST",
                        body: formData
                    });

                    if (!uploadRes.ok) throw new Error("이미지 업로드 실패");
                    const uploadData = await uploadRes.json();
                    imagePath = uploadData.image_url || imagePath;
                } catch (error) {
                    console.error(error);
                    alert("이미지 업로드 중 오류가 발생했습니다.");
                    return;
                }
            }

            const send_data = {
                id: 0,
                name: document.getElementById("add-name").value,
                level: Number(document.getElementById("add-level").value),
                habitat: document.getElementById("add-habitat").value,
                hp: Number(document.getElementById("add-hp").value),
                exp: Number(document.getElementById("add-exp").value),
                attack: Number(document.getElementById("add-attack").value),
                drops,
                description: document.getElementById("add-description").value,
                image: imagePath
            };

            const res = await fetch("http://127.0.0.1:8000/monsters", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(send_data)
            });

            if (!res.ok) {
                alert("몬스터 등록에 실패했습니다.");
                return;
            }

            alert("몬스터가 등록되었습니다.");
            location.href = "../index.html";
        }

        // 5. 삭제 기능
        async function deleteMob(id) {
            if (confirm("정말 이 항목을 삭제하시겠습니까?")) {
                await deleteMonster(id);
                if (typeof openAdminMobModal === "function") {
                    openAdminMobModal();
                }
            }
        }

        // 몬스터 전체보기 모달 열기/닫기 및 목록 렌더링
        async function openAdminMobModal() {
            const modal = document.getElementById("adminMobModal");
            const bodyEl = document.getElementById("adminMobModalBody");

            if (!modal || !bodyEl) return;

            modal.classList.add("open");
            bodyEl.innerHTML = "<p style='padding:20px; text-align:center;'>몬스터 목록을 불러오는 중...</p>";

            const allMobs = await getAllMobs();
            if (!allMobs || allMobs.length === 0) {
                bodyEl.innerHTML = "<p style='padding:20px; text-align:center;'>등록된 몬스터가 없습니다.</p>";
                return;
            }

            let tableHtml = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>사진</th>
                            <th>이름</th>
                            <th>레벨</th>
                            <th>서식지</th>
                            <th>체력</th>
                            <th>경험치</th>
                            <th>공격력</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            allMobs.forEach((mob) => {
                const rawImg = mob.image || "";
                const modalImgSrc = /^https?:\/\//i.test(rawImg)
                    ? rawImg
                    : `../${rawImg.replace(/^\.?\//, "")}`;
                tableHtml += `
                    <tr>
                        <td>${mob.id}</td>
                        <td><img src="${modalImgSrc}" alt="${mob.name}" /></td>
                        <td><strong>${mob.name}</strong></td>
                        <td>${mob.level}</td>
                        <td>${mob.habitat}</td>
                        <td>${mob.hp}</td>
                        <td>${mob.exp}</td>
                        <td>${mob.attack}</td>
                        <td>
                            <div class="admin-action-group">
                                <button type="button" class="btn-mob-edit" onclick="handleEditMob('${mob.id}')">수정</button>
                                <button type="button" class="btn-mob-delete" onclick="deleteMob('${mob.id}')">삭제</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            tableHtml += `
                    </tbody>
                </table>
            `;
            bodyEl.innerHTML = tableHtml;
        }

        function closeAdminMobModal() {
            const modal = document.getElementById("adminMobModal");
            if (modal) modal.classList.remove("open");
        }

        function handleAdminModalBackdropClick(e) {
            if (e.target && e.target.id === "adminMobModal") {
                closeAdminMobModal();
            }
        }

        // [신규 추가] 수정용 모달 열기/닫기 (수정 저장 기능은 미구현 상태)
        async function handleEditMob(id) {
            const modal = document.getElementById("adminEditMobModal");
            const idInput = document.getElementById("edit-id");
            if (idInput) idInput.value = id;



            const mob = await fetchMobById(id);
            if (mob) {
                document.getElementById("edit-name").value = mob.name ?? "";
                document.getElementById("edit-level").value = mob.level ?? "";
                document.getElementById("edit-habitat").value = mob.habitat ?? "";
                document.getElementById("edit-hp").value = mob.hp ?? "";
                document.getElementById("edit-exp").value = mob.exp ?? "";
                document.getElementById("edit-drops").value = Array.isArray(mob.drops)
                    ? mob.drops.map((d) => (typeof d === "string" ? d : d?.name)).filter(Boolean).join(", ")
                    : (mob.drops ?? "");
                document.getElementById("edit-attack").value = mob.attack ?? "";
                document.getElementById("edit-description").value = mob.description ?? "";

            }

            if (modal) modal.classList.add("open");
        }

        function closeEditMobModal() {
            const modal = document.getElementById("adminEditMobModal");
            if (modal) modal.classList.remove("open");
        }

        function handleEditModalBackdropClick(e) {
            if (e.target && e.target.id === "adminEditMobModal") {
                closeEditMobModal();
            }
        }




        // 수정하기 버튼 클릭 시 수정 데이터 전송
        async function handleUpdateMob() {
            console.log("수정하기 클릭됨");
            const id = Number(document.getElementById("edit-id").value);
            const name = document.getElementById("edit-name").value;
            const level = Number(document.getElementById("edit-level").value);
            const habitat = document.getElementById("edit-habitat").value.trim();
            const hp = Number(document.getElementById("edit-hp").value);
            const exp = Number(document.getElementById("edit-exp").value);
            const attack = Number(document.getElementById("edit-attack").value);
            const dropsText = document.getElementById("edit-drops").value;
            const drops = dropsText
                .split(",")
                .map((item) => item.trim())
                .filter(Boolean)
                .map((itemName) => ({ name: itemName }));
            const description = document.getElementById("edit-description").value;

            if (!name || !habitat || !description || Number.isNaN(level) || Number.isNaN(hp) || Number.isNaN(exp) || Number.isNaN(attack)) {
                alert("수정 내역을 올바르게 입력해주세요.");
                return;
            }

            // 수정된 데이터를 서버에 보내기 위해서 만든 것
            const modifyData = { id, name, level, habitat, hp, exp, drops, attack, description };

            const updated = await updateMonster(modifyData);
            if (!updated) return;

            closeEditMobModal();
            if (typeof openAdminMobModal === "function") {
                openAdminMobModal();
            }
        }
    </script>
</body>

</html>
