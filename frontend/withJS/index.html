<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>하얀 사막</title>
  <style>
    :root {
      --sky-light: #e8f6ff;
      --sky-mid: #cbeaff;
      --sky-deep: #4da3e0;
      --sand-white: #fcfaf5;
      --sand-warm: #f5e6c4;
      --sand-gold: #d9a441;
      --sand-amber: #b87d24;
      --ink-dark: #2c353d;
      --ink-muted: #5f6c78;
      --card-border: rgba(217, 164, 65, 0.35);
      --shadow-soft: 0 10px 26px rgba(45, 95, 135, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink-dark);
      background:
        radial-gradient(circle at 82% 10%, rgba(255, 250, 224, 0.95) 0%, rgba(255, 250, 224, 0) 28%),
        linear-gradient(180deg,
          #b9e2ff 0%,
          var(--sky-light) 34%,
          var(--sand-white) 62%,
          var(--sand-warm) 100%);
      padding-bottom: 64px;
    }

    h1 {
      margin: 0;
      padding: 36px 20px 18px;
      text-align: center;
      font-size: clamp(1.65rem, 3.2vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #1f4e78;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.9);
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 8px 16px 28px;
    }

    nav button,
    nav a.nav-link {
      appearance: none;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(77, 163, 224, 0.45);
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(6px);
      color: #235784;
      font-size: 0.98rem;
      font-weight: 700;
      padding: 11px 22px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(58, 123, 173, 0.1);
      transition: transform 0.18s ease, background-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    nav button:hover,
    nav a.nav-link:hover {
      transform: translateY(-2px);
      background: #ffffff;
      border-color: var(--sand-gold);
      color: var(--sand-amber);
      box-shadow: 0 7px 16px rgba(217, 164, 65, 0.22);
    }

    nav button.active,
    nav a.nav-link.active {
      background: linear-gradient(135deg, #4da3e0 0%, #7ec4f2 55%, #e8be68 100%);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 6px 18px rgba(77, 163, 224, 0.35);
      text-shadow: 0 1px 2px rgba(20, 50, 80, 0.25);
    }

    /* 우측 상단 RPG 스타일 로그인 창 */
    .rpg-login-box {
      position: fixed;
      top: 18px;
      right: 22px;
      z-index: 100;
      width: 248px;
      padding: 14px 16px 15px;
      border-radius: 16px;
      background: linear-gradient(165deg, rgba(255, 253, 248, 0.94) 0%, rgba(245, 230, 196, 0.92) 100%);
      border: 1.5px solid rgba(217, 164, 65, 0.65);
      box-shadow:
        0 10px 24px rgba(31, 78, 120, 0.16),
        inset 0 0 0 1px rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
    }

    .rpg-login-box h2 {
      margin: 0 0 10px;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #1f4e78;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(217, 164, 65, 0.35);
      padding-bottom: 6px;
    }

    .rpg-login-box h2::after {
      content: "GUILD ACCESS";
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--sand-amber);
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(217, 164, 65, 0.45);
      padding: 2px 6px;
      border-radius: 999px;
    }

    .rpg-login-box form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .rpg-login-box input[type="text"],
    .rpg-login-box input[type="password"] {
      width: 100%;
      padding: 8px 11px;
      border-radius: 10px;
      border: 1px solid rgba(77, 163, 224, 0.45);
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink-dark);
      font-size: 0.86rem;
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .rpg-login-box input[type="text"]:focus,
    .rpg-login-box input[type="password"]:focus {
      border-color: var(--sand-gold);
      box-shadow: 0 0 0 3px rgba(217, 164, 65, 0.22);
    }

    .rpg-login-box label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--ink-muted);
      cursor: pointer;
      user-select: none;
    }

    .rpg-login-box input[type="checkbox"] {
      accent-color: var(--sand-amber);
      cursor: pointer;
    }

    .rpg-login-box input[type="submit"] {
      margin-top: 2px;
      width: 100%;
      padding: 9px 12px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #ffffff;
      background: linear-gradient(135deg, #3b93d4 0%, #6cb9ee 52%, #dfa944 100%);
      box-shadow: 0 5px 14px rgba(59, 147, 212, 0.32);
      transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
    }

    .rpg-login-box input[type="submit"]:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
      box-shadow: 0 7px 18px rgba(217, 164, 65, 0.36);
    }

    @media (max-width: 960px) {
      .rpg-login-box {
        position: static;
        width: min(340px, calc(100% - 32px));
        margin: 0 auto 18px;
      }
    }

    #content {
      max-width: 1060px;
      margin: 0 auto;
      padding: 0 20px;
    }

    #content h2 {
      margin: 8px 0 22px;
      padding: 12px 18px;
      font-size: 1.35rem;
      font-weight: 800;
      color: #5d4012;
      background: linear-gradient(90deg, rgba(255, 252, 245, 0.92) 0%, rgba(245, 230, 196, 0.78) 65%, rgba(203, 234, 255, 0.55) 100%);
      border-left: 5px solid var(--sand-gold);
      border-radius: 0 12px 12px 0;
      box-shadow: 0 4px 14px rgba(184, 125, 36, 0.08);
    }

    .elimination-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      align-items: stretch;
    }

    @media (max-width: 900px) {
      .elimination-list {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: linear-gradient(180deg, #ffffff 0%, var(--sand-white) 72%, #faeed4 100%);
      border: 1px solid var(--card-border);
      border-radius: 15px;
      padding: 12px 12px 16px;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: var(--sand-gold);
      box-shadow: 0 16px 32px rgba(45, 95, 135, 0.16), 0 0 0 2px rgba(232, 190, 104, 0.25);
    }

    .card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      height: auto;
      object-fit: contain;
      padding: 5px;
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 6px 14px rgba(130, 96, 38, 0.16);
      background-color: rgba(232, 246, 255, 0.65);
      margin-bottom: 11px;
    }

    .card h3 {
      margin: 2px 0 8px;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--ink-dark);
    }

    .card p {
      margin: 0;
      font-size: 0.95rem;
      color: var(--ink-muted);
      background: rgba(255, 255, 255, 0.75);
      padding: 5px 14px;
      border-radius: 999px;
      border: 1px solid rgba(217, 164, 65, 0.25);
    }

    .card p strong {
      color: var(--sand-amber);
      margin-right: 4px;
    }

    /* 몬스터 도감 검색창 및 테이블 정리 */
    .search-box {
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #search-input {
      width: 100%;
      max-width: 420px;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid rgba(217, 164, 65, 0.55);
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink-dark);
      font-size: 0.95rem;
      box-shadow: 0 4px 12px rgba(45, 95, 135, 0.08);
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    #search-input:focus {
      border-color: var(--sky-deep);
      box-shadow: 0 0 0 3px rgba(77, 163, 224, 0.2);
    }

    /* [추가] 검색 버튼 스타일 */
    .search-btn {
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid rgba(77, 163, 224, 0.5);
      background: linear-gradient(135deg, #3b93d4 0%, #6cb9ee 55%, #dfa944 100%);
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(59, 147, 212, 0.25);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .search-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    #content table {
      width: 100%;
      table-layout: fixed;
      border-collapse: separate;
      border-spacing: 0;
      background: rgba(255, 253, 248, 0.94);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-soft);
    }

    #content table thead {
      background: linear-gradient(90deg, #f7ecd2 0%, #e4f3ff 100%);
    }

    #content table th {
      padding: 12px 8px;
      font-size: 0.85rem;
      font-weight: 800;
      color: #1f4e78;
      text-align: center;
      vertical-align: middle;
      border-bottom: 2px solid rgba(217, 164, 65, 0.45);
      white-space: nowrap;
    }

    /* 10개 열 너비 합계 100% 정렬 */
    #content table th:nth-child(1) {
      width: 5%;
    }

    /* ID */
    #content table th:nth-child(2) {
      width: 9%;
    }

    /* 사진 */
    #content table th:nth-child(3) {
      width: 12%;
    }

    /* 이름 */
    #content table th:nth-child(4) {
      width: 8%;
    }

    /* 레벨 */
    #content table th:nth-child(5) {
      width: 13%;
    }

    /* 서식지 */
    #content table th:nth-child(6) {
      width: 8%;
    }

    /* 체력 */
    #content table th:nth-child(7) {
      width: 8%;
    }

    /* 경험치 */
    #content table th:nth-child(8) {
      width: 8%;
    }

    /* 공격력 */
    #content table th:nth-child(9) {
      width: 14%;
    }

    /* 드랍 */
    #content table th:nth-child(10) {
      width: 26%;
    }

    /* 설명 */

    #content table td {
      padding: 10px 8px;
      font-size: 0.88rem;
      line-height: 1.45;
      color: var(--ink-dark);
      text-align: center;
      vertical-align: middle;
      border-bottom: 1px solid rgba(217, 164, 65, 0.22);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #content table tbody tr:nth-child(even) td {
      background-color: rgba(252, 250, 245, 0.75);
    }

    #content table tbody tr:hover td {
      background-color: rgba(232, 246, 255, 0.55);
    }

    #content table tbody tr:last-child td {
      border-bottom: none;
    }

    #content table td:nth-child(3) strong {
      color: #1f4e78;
      font-weight: 800;
    }

    #content table td:nth-child(4) {
      font-weight: 700;
      color: var(--sand-amber);
    }

    #content table td:nth-child(6),
    #content table td:nth-child(7),
    #content table td:nth-child(8) {
      font-variant-numeric: tabular-nums;
      color: var(--ink-muted);
      font-weight: 600;
    }

    #content table td:nth-child(9),
    #content table td:nth-child(10) {
      text-align: left;
      white-space: normal;
      word-break: keep-all;
    }

    #content table td:nth-child(9) {
      font-size: 0.84rem;
      font-weight: 600;
      color: #5d4012;
    }

    #content table td:nth-child(10) {
      font-size: 0.84rem;
      color: var(--ink-muted);
    }

    #content table img {
      display: block;
      margin: 0 auto;
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 8px;
      border: 1.5px solid rgba(217, 164, 65, 0.45);
      box-shadow: 0 3px 8px rgba(45, 95, 135, 0.12);
      cursor: pointer;
      /* [추가] 클릭 가능한 원본 이미지 표시 */
    }

    /* [추가] 원본 이미지 확대 모달 스타일 */
    #imageModal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(18, 32, 46, 0.72);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #imageModal.open {
      display: flex;
    }

    #imageModal .modal-box {
      position: relative;
      max-width: min(680px, 92vw);
      max-height: 88vh;
      padding: 16px;
      border-radius: 16px;
      background: var(--sand-white);
      border: 2px solid var(--sand-gold);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #imageModal img {
      max-width: 100%;
      max-height: 72vh;
      object-fit: contain;
      border-radius: 10px;
    }

    #imageModal .modal-caption {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--ink-dark);
    }

    #imageModal .modal-close {
      position: absolute;
      top: 10px;
      right: 12px;
      border: none;
      background: rgba(255, 255, 255, 0.9);
      color: var(--ink-dark);
      font-size: 1.1rem;
      font-weight: 800;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
  </style>
  <link rel="stylesheet" href="./css/desert-theme.css" />
</head>

<body>

  <aside class="rpg-login-box">
    <form id="loginForm">
      <h2>로그인</h2>
      <input type="text" placeholder="아이디" />
      <input type="password" placeholder="비밀번호" />
      <label><input type="checkbox" />아이디 저장하기</label>
      <input type="submit" value="Login" />
    </form>
  </aside>

  <h1>하얀 사막에 오신 여러분들을 환영합니다.</h1>
  <nav>
    <button id="nav-home" class="active" onclick="renderHome()">
      홈으로
    </button>
    <button id="nav-all" onclick="renderAllMobs()">몬스터 도감</button>
    <button id="nav-manage" onclick="location.href='./admin/admin_create.html'">관리자 페이지</button>
    <a class="nav-link" href="./FromHome/board/board.html">커뮤니티</a>
    <a class="nav-link" href="./FromHome/notice/notice.html">공지사항</a>
  </nav>

  <div id="content"></div>

  <!-- [추가] 원본 이미지 보기용 모달 마크업 -->
  <div id="imageModal" onclick="handleModalBackdropClick(event)">
    <div class="modal-box">
      <button type="button" class="modal-close" onclick="closeImageModal()" aria-label="닫기">✕</button>
      <img id="modalImage" src="" alt="" />
      <div id="modalCaption" class="modal-caption"></div>
    </div>
  </div>

  <script src="./js/data_api.js"></script>
  <script>
    // 돔(DOM) 제어 코드 작성..

    const contentDiv = document.getElementById("content");
    renderHome();

    // 네비게이션 버튼 활성화 표시
    function updateNav(activeId) {
      document
        .querySelectorAll("nav button")
        .forEach((btn) => btn.classList.remove("active"));
      document.getElementById(activeId).classList.add("active");
    }

    // 2. 홈 화면 (랜덤 추천 3개) --------------------------------------------
    async function renderHome() {
      updateNav("nav-home");

      mobList = await getAllMobs();  //목적 서버로 부터 메뉴 정보를 달라고 기다려
      //                  얕은복사     정렬(오름차순 내림차순, 랜덤하게)
      const shuffled = [...mobList].sort(() => 0.5 - Math.random());
      const selected = shuffled.slice(0, 3);

      let html =
        "<h2>오늘의 제거 의뢰 몬스터 (일일 퀘스트)</h2><div class='elimination-list'>";
      selected.forEach((obj) => {
        html += `
          <div class="card">
            <img src="${obj.image}" alt="${obj.name}" />
            <h3>${obj.name}</h3>
            <p><strong>레벨:</strong> ${obj.level} </p>
            
          </div>
        `;
      });
      contentDiv.innerHTML = html;
    }
    // -----------------------------------------------------------------------

    //2가지.. 하나는 전체보기, 검색어로 검색한 결과를 랜더링.---------------------
    async function renderAllMobs(filterKeyword = "") { //매개변수없어. 콜할땡 인자값없으면 값은"
      updateNav("nav-all");
      let filteredList;
      if (filterKeyword == "") {  // 전체기능, 데이터를 다 가져오자 (서버통신)
        filteredList = await getAllMobs();
      } else { //검색기능   // 데이터를 검색어로 필터링 해서 가져오자 (서버통신)
        filteredList = await searchMobs(filterKeyword);
      }
      //const filteredList = filterKeyword ? await searchMenus(filterKeyword) : await getAllMenus();

      let html = `
        <h2>몬스터 도감</h2>
        <div class="search-box">
          <input type="text" id="search-input" placeholder="네임,레벨,서식지로 검색..." value="${filterKeyword}" onchange="handleSearch(event)">
          <!-- [추가] 검색 실행 버튼 -->
          <button type="button" class="search-btn" onclick="handleSearchButton()">검색</button>
        </div>
      `;

      if (filteredList.length === 0) {
        html += "<p>검색 결과가 없습니다.</p>";
      } else {
        html += `
          <table>
            <thead>
              <tr>
                <th style="width: 10%;">ID</th>
                <th style="width: 15%;">사진</th>
                <th style="width: 40%;">이름</th>
                <th style="width: 10%;">레벨</th>
                <th style="width: 35%;">서식지</th>
                <th style="width: 15%;">체력(hp)</th>
                <th style="width: 15%;">경험치</th>
                <th style="width: 15%;">공격력</th>
                <th style="width: 20%;">드랍</th>
                <th style="width: 30%;">설명</th>
                
              </tr>
            </thead>
            <tbody>
        `;

        filteredList.forEach((obj) => {
          html += `
            <tr>
              <td>${obj.id}</td>
              <!-- [수정] 이미지 클릭 시 원본 이미지를 모달로 여는 핸들러 추가 -->
              <td><img src="${obj.image}" alt="${obj.name}" onclick="openImageModal('${obj.image}', '${obj.name}')" /></td>
              <td><strong>${obj.name}</strong></td>
              <td>${obj.level} </td>
              <td>${obj.habitat}</td>
              <td>${obj.hp}</td>
              <td>${obj.exp}</td>
              <td>${obj.attack}</td>
              <td>${Array.isArray(obj.drops) && obj.drops.length > 0
              ? obj.drops.map((d) => d.name).filter(Boolean).join(", ")
              : "-"}</td>
              <td>${obj.description}</td>
            
              
              
            </tr>
          `;
        });

        html += `
            </tbody>
          </table>
        `;
      }
      contentDiv.innerHTML = html;
    }

    // 검색어 입력 이벤트 핸들러
    function handleSearch(e) {
      //alert(e.target.value)
      renderAllMobs(e.target.value);
    }
    //------------------------------------------------------------------------

    // 검색 버튼 클릭 시 입력창의 검색어로 도감 검색 실행
    function handleSearchButton() {
      const inputEl = document.getElementById("search-input");
      renderAllMobs(inputEl ? inputEl.value : "");
    }

    // [추가] 원본 이미지 모달 열기/닫기 함수
    function openImageModal(src, caption = "") {
      const modal = document.getElementById("imageModal");
      const modalImg = document.getElementById("modalImage");
      const modalCaption = document.getElementById("modalCaption");
      if (!modal || !modalImg) return;
      modalImg.src = src;
      modalImg.alt = caption;
      if (modalCaption) modalCaption.textContent = caption;
      modal.classList.add("open");
    }

    function closeImageModal() {
      const modal = document.getElementById("imageModal");
      const modalImg = document.getElementById("modalImage");
      if (modal) modal.classList.remove("open");
      if (modalImg) modalImg.src = "";
    }

    function handleModalBackdropClick(e) {
      if (e.target && e.target.id === "imageModal") {
        closeImageModal();
      }
    }




  </script>


</body>
