<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>하얀사막 - 게시글 작성</title>
  </head>
  <body>
    <div id="header"></div>
    <main>
      <h2>글쓰기</h2>
      <form id="postForm">
        <!--form은 동작원리는 브라우저가 입력값들을 모아서 서보로 보낸다. 
        주소 뒤에 ? 변수=값 형태로 보낸다. 
        이 요청에 대해 서버가 응답한 새 페이지로 브라우저가 화면 전체를 이동, 즉 새로고침한다-->
        <div>
          <label for="author">작성자</label>
          <input type="text" id="author" maxlength="20" required />
        </div>
        <div>
          <label for="title">제목</label>
          <input type="text" id="title" maxlength="100" required />
        </div>
        <div>
          <label for="content">내용</label>
          <textarea id="content" rows="12" required></textarea>
        </div>
        <button type="submit">등록</button>
        <a href="allPosts.html"><button type="button">취소</button></a>
      </form>
    </main>
    <script src="include.js"></script>
    <script src="writePost.js"></script>
  </body>
</html>
