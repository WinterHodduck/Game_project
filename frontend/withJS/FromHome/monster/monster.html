<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>하얀사막 - 이벤트</title>
  </head>
  <body>
    <header>
      <h1>이벤트</h1>
      <a href="../../index.html"><button>홈으로</button></a>
      <button>전체 몬스터 보기</button>
      <button>몬스터 찾기</button>
    </header>
    <aside>
      <h2>👻 모험 도우미 백정령</h2>
      <div id="chatbox">
        <div id="botMessage">
          어서와, 하얀사막은 처음이지? 궁금한거 있으면 뭐든 알려줄게!
        </div>
        <div id="userChat">
          <textarea
            id="chatInput"
            placeholder="궁금한 점은 여기에 적어주세요"
          ></textarea>
          <button>전송</button>
        </div>
      </div>
    </aside>
    <main>
      <h2>오늘의 경험치 버닝 몬스터!</h2>
      <div id="todayMonster"></div>
    </main>
  </body>
</html>
<script>
  // 드랍 아이템 반복문
  function showItem(drops) {
    return drops.map((d) => d.name).join(" , ");
  }
  async function loadRandomMonsters() {
    const res = await fetch("http://127.0.0.1:8000/api/monsters/random");
    const monsters = await res.json();

    const todayMonster = document.getElementById("todayMonster");
    todayMonster.innerHTML = monsters.map(
      (m) => `
    <div class = "monster-card">
      <h3>이름: ${m.name}</h3>
      <p>레벨: ${m.level}</p>
      <p>출현지역: ${m.habitat}</p>
      <p>체력: ${m.hp}</p>
      <p>경험치: ${m.exp}</p>
      <p>공격력: ${m.attack}</p>
      <p>드랍아이템: ${showItem(m.drops)}</p>
      <p>설명: ${m.description}</p>
    `,
    );
  }
  loadRandomMonsters();
</script>
