<!doctype html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>하얀사막 - 공지사항</title>
</head>

<body>
    <header>
        <h1>공지사항</h1>
        <nav>
            <a href="../../index.html">메인화면</a> |
            <a href="../monster/monster.html">몬스터 도감</a> |
            <a href="../board/board.html">게시판</a>
        </nav>
    </header>

    <main>
        <section>
            <select id="categoryFilter">
                <option value="">전체 카테고리</option>
                <option value="일반">일반</option>
                <option value="점검">점검</option>
                <option value="이벤트">이벤트</option>
                <option value="업데이트">업데이트</option>
            </select>

            <input type="text" id="searchInput" placeholder="제목 검색" />
            <button type="button" id="searchBtn">검색</button>
            <a href="./notice-write.html"><button type="button">공지 작성</button></a>
        </section>

        <hr />

        <table border="1" width="100%" cellspacing="0" cellpadding="8">
            <thead>
                <tr>
                    <th width="10%">구분</th>
                    <th width="45%">제목</th>
                    <th width="15%">작성자</th>
                    <th width="10%">조회수</th>
                    <th width="20%">작성일</th>
                </tr>
            </thead>
            <tbody id="noticeTableBody">
                <tr>
                    <td colspan="5" align="center">불러오는 중...</td>
                </tr>
            </tbody>
        </table>
    </main>

    <script src="./notice.js"></script>
    <script>
        const tableBody = document.getElementById("noticeTableBody");
        const categoryFilter = document.getElementById("categoryFilter");
        const searchInput = document.getElementById("searchInput");
        const searchBtn = document.getElementById("searchBtn");

        let cachedNotices = [];

        async function loadNoticeList() {
            try {
                const category = categoryFilter.value;
                const url = category
                    ? `${API_BASE}?category=${encodeURIComponent(category)}`
                    : API_BASE;

                cachedNotices = await requestNotice(url);
                renderTable();
            } catch (err) {
                tableBody.innerHTML = `<tr><td colspan="5" align="center">${escapeHtml(err.message)}</td></tr>`;
            }
        }

        function renderTable() {
            const keyword = searchInput.value.trim().toLowerCase();
            const filtered = keyword
                ? cachedNotices.filter((n) => n.title.toLowerCase().includes(keyword))
                : cachedNotices;

            if (filtered.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" align="center">등록된 공지사항이 없습니다.</td></tr>`;
                return;
            }

            tableBody.innerHTML = filtered
                .map((notice) => {
                    const pinBadge = notice.isPinned ? "<strong>[고정]</strong> " : "";
                    return `
              <tr>
                <td align="center">${escapeHtml(notice.category)}</td>
                <td>
                  ${pinBadge}
                  <a href="./notice-detail.html?id=${encodeURIComponent(notice.id)}">
                    ${escapeHtml(notice.title)}
                  </a>
                </td>
                <td align="center">${escapeHtml(notice.author)}</td>
                <td align="center">${notice.views ?? 0}</td>
                <td align="center">${formatDate(notice.createdAt)}</td>
              </tr>
            `;
                })
                .join("");
        }

        categoryFilter.addEventListener("change", loadNoticeList);
        searchBtn.addEventListener("click", renderTable);
        searchInput.addEventListener("keyup", (e) => {
            if (e.key === "Enter") renderTable();
        });

        loadNoticeList();
    </script>
</body>

</html>
